<!doctype html>
<html lang="en">
<head>

<title>PriorityMeter</title>

</head>
<body>
<div id="root">
<div class="ds-stack">
<div class="ds-group"><p class="label">Five steps, highest first, each with its word</p>
<div class="ds-row"><span class="priority" role="meter" aria-label="Priority" aria-valuemin="1" aria-valuemax="5" aria-valuenow="5" aria-valuetext="Show-stopper"><span class="priority-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="priority-word">Show-stopper</span></span><span class="priority" role="meter" aria-label="Priority" aria-valuemin="1" aria-valuemax="5" aria-valuenow="4" aria-valuetext="Critical"><span class="priority-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="priority-word">Critical</span></span><span class="priority" role="meter" aria-label="Priority" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3" aria-valuetext="Major"><span class="priority-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="priority-word">Major</span></span><span class="priority" role="meter" aria-label="Priority" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2" aria-valuetext="Normal"><span class="priority-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="priority-word">Normal</span></span><span class="priority" role="meter" aria-label="Priority" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Minor"><span class="priority-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="priority-word">Minor</span></span></div></div>
<div class="ds-group"><p class="label">Beside how an issue stands, and its tags</p>
<div class="ds-row"><span class="issue-id">BACK-21</span><span class="badge warn"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17z"/><path d="M12 7.5V12l3 2"/></svg>Blocked</span><span class="priority" role="meter" aria-label="Priority" aria-valuemin="1" aria-valuemax="5" aria-valuenow="5" aria-valuetext="Show-stopper"><span class="priority-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="priority-word">Show-stopper</span></span><span class="chips"><span class="chip">export</span></span></div>
<div class="ds-row"><span class="issue-id">BACK-23</span><span class="badge good"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M5.5 12.5l4 4 9-9"/></svg>Fixed</span><span class="priority" role="meter" aria-label="Priority" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2" aria-valuetext="Normal"><span class="priority-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="priority-word">Normal</span></span><span class="chips"><span class="chip">search</span></span></div></div>
</div>
</div>

</html>
