<!-- @dsCard group="Pages" height=430 subtitle="A card, a table and a chart while they load: in the shape they will have, still" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skeleton</title>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../showcase.css">
</head>
<body>
<div id="root">
<div class="ds-cols">
<div class="ds-group"><p class="label">A card</p>
<section class="card" aria-busy="true"><p class="skeleton-words" role="status">Loading…</p>
<div class="skeleton" aria-hidden="true"><div class="skeleton-title"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
</section></div>
<div class="ds-group"><p class="label">A table's rows</p>
<section class="card" aria-busy="true"><p class="skeleton-words" role="status">Loading…</p>
<div class="skeleton" aria-hidden="true">
<div class="skeleton-row"><div></div><div></div><div></div></div>
<div class="skeleton-row"><div></div><div></div><div></div></div>
<div class="skeleton-row"><div></div><div></div><div></div></div>
<div class="skeleton-row"><div></div><div></div><div></div></div>
</div></section></div>
<div class="ds-group"><p class="label">A chart</p>
<section class="card" aria-busy="true"><p class="skeleton-words" role="status">Loading…</p>
<div class="skeleton" aria-hidden="true"><div class="skeleton-title"></div><div class="skeleton-block"></div></div>
</section></div>
</div>
</div>
</body>
</html>
