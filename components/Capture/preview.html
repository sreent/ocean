<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture</title>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../showcase.css">
</head>
<body>
<div id="root">
<div class="ds-phone">
<section class="capture" aria-label="Photograph a receipt">
<header class="capture-head"><button type="button" class="round" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M7 7l10 10"/><path d="M17 7L7 17"/></svg></button><span>Photograph a receipt</span><span class="chip">Auto-capture on</span></header>
<div class="capture-frame"><div class="receipt" role="img" aria-label="A receipt: Restaurant, Singapore, 5 Nov 2026, SGD 186.00, card 4417">
<p class="center"><strong>RESTAURANT</strong></p><p class="center">Singapore</p><hr>
<p><span>05/11/2026</span><span>20:14</span></p><p><span>Table 12 · 4 guests</span></p><hr>
<p><span>Mains x4</span><span>132.00</span></p><p><span>Drinks</span><span>38.00</span></p><p><span>Service</span><span>16.00</span></p><hr>
<p><strong>TOTAL</strong><strong>SGD 186.00</strong></p><p><span>VISA ••4417</span></p><p class="center">Thank you</p>
</div></div>
<p class="capture-found" role="status">Receipt found. Hold still…</p>
<footer class="capture-foot"><button type="button" class="round" aria-label="From your photos"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M3.5 5h17v14h-17z"/><path d="M3.5 16l5-5 4 4 2.5-2.5 5.5 5.5"/><path d="M15.5 7.75a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/></svg></button><button type="button" class="shutter" aria-label="Take the photo"></button><button type="button" class="round" aria-label="A file"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M19.5 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.6 1.6 0 0 1-2.3-2.3l7.6-7.6"/></svg></button></footer>
</section>
</div>
</div>
</body>
</html>
