<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ocean</title>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../showcase.css">
</head>
<body>
<div id="root" class="ds-cover">
<svg viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: ocean-200 120, ocean-600 180, lagoon-700 90, coral-700 30, kelp-300 60 wide, each 288 tall: widths in steps of space-8 (30px)
     arrangement: a strip of unequal bands, the sea's layers, from x 480 to the right edge, bleeding off the top and bottom
     pattern: the wave, a literal motif, because Ocean takes a hint of the sea: eight half-discs cut from the bands' top in the ground
     steps: 30px (space-8) widths and radius, half the 60px pitch, as radius-pill draws a disc -->
<rect class="tint" x="480" y="0" width="120" height="288"/>
<rect class="ocean" x="600" y="0" width="180" height="288"/>
<rect class="lagoon" x="780" y="0" width="90" height="288"/>
<rect class="coral" x="870" y="0" width="30" height="288"/>
<rect class="kelp" x="900" y="0" width="60" height="288"/>
<circle class="ground" cx="510" cy="0" r="30"/>
<circle class="ground" cx="570" cy="0" r="30"/>
<circle class="ground" cx="630" cy="0" r="30"/>
<circle class="ground" cx="690" cy="0" r="30"/>
<circle class="ground" cx="750" cy="0" r="30"/>
<circle class="ground" cx="810" cy="0" r="30"/>
<circle class="ground" cx="870" cy="0" r="30"/>
<circle class="ground" cx="930" cy="0" r="30"/>
</svg>
<div class="ds-cover-name">
<h1>Ocean</h1>
<p>One look for a5s, a7c and a3t: calm, with colour only where it means something.</p>
</div>
</div>
</body>
</html>
